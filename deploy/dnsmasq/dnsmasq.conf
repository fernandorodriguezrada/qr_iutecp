# Servidor DNS local para la red del IUTECP
# Resuelve asistencias.iutecp.edu.ve y asistencias.local hacia la IP del servidor
domain-needed
bogus-priv
no-resolv
no-poll

# Redirigir dominios institucionales a la IP del servidor
address=/asistencias.iutecp.edu.ve/__SERVER_IP__
address=/asistencias.local/__SERVER_IP__

# Servidores DNS de reenvío en caso de que sí haya internet externo (CANTV/WAN)
server=1.1.1.1
server=8.8.8.8
