services:
  db:
    image: mariadb:11.8
    container_name: qr_iutecp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-iutecp_root_secure_2026}
      MYSQL_DATABASE: ${DB_NAME:-qr_iutecp}
      MYSQL_USER: ${DB_USER:-iutecp_user}
      MYSQL_PASSWORD: ${DB_PASS:-iutecp_secure_pass_2026}
      TZ: America/Caracas
    volumes:
      - db_data:/var/lib/mysql
      # Auto-import initial clean schema on first run (creates tables & admin user)
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: deploy/php/Dockerfile
    container_name: qr_iutecp_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-qr_iutecp}
      DB_USER: ${DB_USER:-iutecp_user}
      DB_PASS: ${DB_PASS:-iutecp_secure_pass_2026}
      APP_ENV: production
    volumes:
      - .:/var/www/html:ro
      # Grant write permissions for QR code cache if generated on filesystem
      - qr_cache:/var/www/html/includes/phpqrcode/cache
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_net

  web:
    image: nginx:1.25-alpine
    container_name: qr_iutecp_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - internal_net

volumes:
  db_data:
    name: qr_iutecp_db_data
  qr_cache:
    name: qr_iutecp_qr_cache

networks:
  internal_net:
    name: qr_iutecp_network
    driver: bridge
