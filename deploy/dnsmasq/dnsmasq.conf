# Servidor DNS local para la red del IUTECP
# Resuelve los dominios institucionales y dinámicos hacia la IP local del servidor
domain-needed
bogus-priv
no-resolv
no-poll

# Redirigir dominios a la IP del servidor
address=/asistencias-iutecp.duckdns.org/__SERVER_IP__
address=/asistencias.iutecp.edu.ve/__SERVER_IP__
address=/asistencias.local/__SERVER_IP__

# Servidores DNS de reenvío en caso de que sí haya internet externo (CANTV/WAN)
server=1.1.1.1
server=8.8.8.8
